<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0b1018">
    <title>Cat Meme Battlegrounds</title>
    <!-- link preview when the game link is shared (WhatsApp, Telegram, X, Discord, Facebook), 2026-11-08.
         Image = TemplateData/share.jpg (Tools/UI/make_share_image.py, real gameplay frame); absolute URL required. -->
    <meta name="description" content="Free cat battle royale in your browser. Drop in, grab loot, last cat standing wins. Connect your wallet to climb the leaderboard.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Cat Meme Battlegrounds">
    <meta property="og:title" content="Cat Meme Battlegrounds - Play free in your browser">
    <meta property="og:description" content="Free cat battle royale in your browser. Drop in, grab loot, last cat standing wins.">
    <meta property="og:url" content="https://play.catbattlegrounds.com/">
    <meta property="og:image" content="https://play.catbattlegrounds.com/TemplateData/share.jpg?v=2">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The Cat Meme Battlegrounds lobby with Army Cat">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Cat Meme Battlegrounds - Play free in your browser">
    <meta name="twitter:description" content="Free cat battle royale in your browser. Drop in, grab loot, last cat standing wins.">
    <meta name="twitter:image" content="https://play.catbattlegrounds.com/TemplateData/share.jpg?v=2">
    <link rel="icon" href="TemplateData/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="TemplateData/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
    <link rel="preload" as="image" href="TemplateData/bg.webp">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <!-- Cat Battleground WebGL template (2026-10-29): the game fills the window; the loading screen covers it until Unity is ready. -->
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div id="bg-blur"></div>
      <div id="bg"></div>
      <div id="shade"></div>
      <div id="bar">
        <img class="frame" src="TemplateData/bar_frame.webp" alt="">
        <div id="track"><img id="fill" src="TemplateData/bar_fill.webp" alt=""></div>
        <img class="paw" src="TemplateData/bar_paw.webp" alt="">
        <div id="pct">0%</div>
      </div>
      <div id="tip"></div>
      <div id="dim"></div>
      <div id="login">
        <button class="lb" id="b-wallet" type="button"><img src="TemplateData/btn_wallet.webp" alt="Connect Wallet"><span class="soon">NO WALLET FOUND</span></button>
        <button class="lb" id="b-x" type="button"><img src="TemplateData/btn_x.webp" alt="Connect X"><span class="soon">COMING SOON</span></button>
        <button class="lb" id="b-guest" type="button"><img src="TemplateData/btn_guest.webp" alt="Play as a guest"></button>
      </div>
    </div>
    <div id="unity-warning"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var fill = document.querySelector("#fill");
      var pct = document.querySelector("#pct");
      var tip = document.querySelector("#tip");

      var tips = [
        "Jump from the plane over the island - open your parachute in time!",
        "Medkits heal, armor soaks damage, ammo crates refill your gun.",
        "Stay inside the zone: the storm hurts more every circle.",
        "Hold G to aim a bomb, release to throw it.",
        "Headshots deal 50% more damage.",
        "Zombie Survival: every cleared wave gives you a bomb and some health.",
        "Climb the stairs - the roofs are great sniper spots.",
        "Only one cat walks away. Make it yours."
      ];
      var tipIndex = Math.floor(Math.random() * tips.length), loaded = false;
      function nextTip() {
        if (loaded || tip.classList.contains("err")) return;
        tip.style.opacity = 0;
        setTimeout(function () { tip.textContent = tips[tipIndex++ % tips.length]; tip.style.opacity = 1; }, 400);
      }
      tip.textContent = tips[tipIndex++ % tips.length];
      var tipTimer = setInterval(nextTip, 5000);

      function setProgress(p) {
        p = Math.max(0, Math.min(1, p));
        fill.style.clipPath = "inset(0 " + (100 - p * 100).toFixed(2) + "% 0 0)";
        pct.textContent = Math.floor(p * 100) + "%";
      }

      function showError(msg) {
        clearInterval(tipTimer);
        tip.classList.add("err");
        tip.style.opacity = 1;
        tip.textContent = "Could not start the game: " + msg + " - please reload the page.";
      }

      // Unity's own notices: warnings as a short yellow note, errors on the loading screen
      function unityShowBanner(msg, type) {
        if (type == "error") { showError(msg); return; }
        var box = document.querySelector("#unity-warning");
        var div = document.createElement("div");
        div.textContent = msg;
        box.appendChild(div); box.style.display = "block";
        setTimeout(function () { box.removeChild(div); if (!box.children.length) box.style.display = "none"; }, 5000);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };
      // full-window canvas: no 3x pixel density (desktop 1.5, phones 2 - phones were rendering 2400 px wide, 2026-10-31)
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ? 2 : 1.5);

      // login choice: the game is shown once it has loaded AND the player picked how to play.
      // Wallet (2026-11-06): connects the browser wallet, the game reads its pass cards from the chain (WalletSession.cs,
      // Plugins/WebGL/WalletBridge.jslib). X is not built yet (COMING SOON stamp). Guest = today's device id (LeaderboardApi).
      var unityReady = false, chosen = false;

      // WalletConnect (2026-11-08): phones play in Chrome / Safari (landscape works there) and connect MetaMask, Trust, Bitget ...
      // through WalletConnect; the wallet apps' own browsers are locked to portrait. Used only when the page has no injected
      // wallet (window.ethereum). Project id from cloud.reown.com (public, not a secret; the domain must be allowed there).
      // Empty id = WalletConnect off (old behaviour: "NO WALLET FOUND" without an injected wallet).
      var WC_PROJECT_ID = "4f9ff11898f1f122eef1b8eeae19db0b";
      var WC_LIB = "https://esm.sh/@walletconnect/ethereum-provider@2.17.2";
      var wcProvider = null;
      function wcInit() {
        if (wcProvider) return Promise.resolve(wcProvider);
        return import(WC_LIB).then(function (m) {
          return m.EthereumProvider.init({
            projectId: WC_PROJECT_ID,
            chains: [1],                     // every wallet supports Ethereum; the game only needs the address
            optionalChains: [4663, 46630],   // Robinhood Chain mainnet / testnet
            showQrModal: true,
            methods: ["eth_accounts", "eth_requestAccounts", "personal_sign"],
            metadata: {
              name: "Cat Meme Battlegrounds",
              description: "Free cat battle royale in your browser",
              url: location.origin,
              icons: [location.origin + "/TemplateData/apple-touch-icon.png"]
            }
          });
        }).then(function (p) {
          wcProvider = p;
          p.on("accountsChanged", function (a) { if (cmbgWallet.via !== "wc") return; cmbgWallet.address = (a && a[0]) || ""; cmbgWallet.send(); });
          p.on("disconnect", function () { if (cmbgWallet.via !== "wc") return; cmbgWallet.address = ""; cmbgWallet.via = ""; cmbgWallet.send(); });
          return p;
        });
      }

      var cmbgWallet = window.cmbgWallet = {
        address: "",
        via: "",          // "injected" | "wc"
        busy: false,
        available: function () { return !!window.ethereum || !!WC_PROJECT_ID; },
        send: function () { if (window.unityInstance) window.unityInstance.SendMessage("WalletBridge", "OnWallet", this.address); },
        error: function (m) { if (window.unityInstance) window.unityInstance.SendMessage("WalletBridge", "OnWalletError", m); },
        connected: function (addr, via) {
          this.address = addr || ""; this.via = this.address ? via : "";
          try { if (this.address) localStorage.setItem("cmbgWallet", via === "wc" ? "wc" : "1"); } catch (e) {}
          this.send();
          return this.address;
        },
        connect: function () {
          var self = this, eth = window.ethereum;
          if (self.busy) return Promise.resolve("");
          if (eth) {
            self.busy = true;
            return eth.request({ method: "eth_requestAccounts" }).then(function (a) {
              self.busy = false;
              return self.connected(a && a[0], "injected");
            }).catch(function (e) {
              self.busy = false;
              self.error(e && e.code === 4001 ? "Wallet connection cancelled." : "Wallet error: " + ((e && e.message) || e));
              return "";
            });
          }
          if (!WC_PROJECT_ID) { self.error("No wallet found. Install MetaMask, or open the game in your wallet app's browser."); return Promise.resolve(""); }
          self.busy = true;
          return wcInit().then(function (p) {
            if (p.session && p.accounts && p.accounts[0]) return p.accounts;   // still connected from before
            return p.connect().then(function () { return p.accounts; });
          }).then(function (a) {
            self.busy = false;
            return self.connected(a && a[0], "wc");
          }).catch(function (e) {
            self.busy = false;
            var m = String((e && e.message) || e || "");
            self.error(/reset|reject|closed|cancel/i.test(m) ? "Wallet connection cancelled." : "Wallet error: " + m);
            return "";
          });
        },
        disconnect: function () {
          if (this.via === "wc" && wcProvider) { try { wcProvider.disconnect().catch(function () {}); } catch (e) {} }
          this.address = ""; this.via = "";
          try { localStorage.removeItem("cmbgWallet"); } catch (e) {}
        },
        ready: function () { if (this.address) this.send(); }   // Unity asks for it once it runs
      };
      if (window.ethereum && window.ethereum.on) {
        window.ethereum.on("accountsChanged", function (a) {
          if (cmbgWallet.via !== "injected") return;   // not connected through the game: ignore
          cmbgWallet.address = (a && a[0]) || "";
          cmbgWallet.send();
        });
      }
      // a wallet connected on an earlier visit comes back silently (eth_accounts / a saved WalletConnect session never open a popup)
      try {
        var savedWallet = localStorage.getItem("cmbgWallet");
        if (savedWallet === "1" && window.ethereum) {
          window.ethereum.request({ method: "eth_accounts" }).then(function (a) {
            if (a && a[0]) cmbgWallet.connected(a[0], "injected");
          }).catch(function () {});
        } else if (savedWallet === "wc" && WC_PROJECT_ID && !window.ethereum) {
          wcInit().then(function (p) {
            if (p.session && p.accounts && p.accounts[0]) cmbgWallet.connected(p.accounts[0], "wc");
          }).catch(function () {});
        }
      } catch (e) {}
      function reveal() {
        if (!unityReady || !chosen) return;
        setTimeout(function () {
          document.querySelector("#loading").classList.add("done");
          setTimeout(function () { document.querySelector("#loading").style.display = "none"; }, 700);
          canvas.focus();
        }, 450);
      }
      function comingSoon(btn) {
        var stamp = btn.querySelector(".soon");
        btn.classList.remove("nope"); stamp.classList.remove("show");
        void btn.offsetWidth;   // restart the animations
        btn.classList.add("nope"); stamp.classList.add("show");
      }
      document.querySelector("#b-wallet").onclick = function () {
        var btn = this, stamp = btn.querySelector(".soon");
        if (chosen) return;
        if (!cmbgWallet.available()) { stamp.textContent = "NO WALLET FOUND"; comingSoon(btn); return; }
        cmbgWallet.connect().then(function (addr) {
          if (!addr) { stamp.textContent = "CANCELLED"; comingSoon(btn); return; }
          choose();
        });
      };
      document.querySelector("#b-x").onclick = function () { comingSoon(this); };
      document.querySelector("#b-guest").onclick = function () { choose(); };
      function choose() {
        if (chosen) return;
        chosen = true;
        document.querySelector("#loading").classList.add("chosen");
        // phones: a button press is the moment the browser allows fullscreen + landscape lock
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          var el = document.documentElement, fs = el.requestFullscreen || el.webkitRequestFullscreen;
          try { var pr = fs && fs.call(el); if (pr && pr.then) pr.then(function () { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {}); }).catch(function () {}); } catch (e) {}
        }
        reveal();
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onerror = function () { showError("the game files did not download"); };
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          // Unity reports ~0.9 when the download is done; the rest is starting the engine
          setProgress(progress);
          if (progress >= 0.9 && !loaded) { clearInterval(tipTimer); tip.style.opacity = 1; tip.textContent = "Preparing the island..."; }
        }).then(function (unityInstance) {
          loaded = true;
          window.unityInstance = unityInstance;
          cmbgWallet.ready();   // a wallet picked before the engine was up
          setProgress(1);
          unityReady = true;
          if (!chosen) { tip.style.opacity = 1; tip.textContent = "Ready! Choose how to play."; }
          reveal();
        }).catch(function (message) { showError(String(message)); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
