name = "cmbg-reveal"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
crons = ["* * * * *"]

[vars]
CHAIN_ID = "46630"
RPC_URL = "https://rpc.testnet.chain.robinhood.com"
# HashChainRandomSource the operator serves (Contracts/deployments/robinhoodTestnet.json -> HashChainRandomSource)
SOURCE = "0xf0a9e4C1F91dC40223b410Dc5B10E914c12CE76d"
ALLOW_ORIGIN = "*"

# ---- MAINNET (2026-11-07): its own Worker "cmbg-reveal-mainnet" (own operator wallet + own secrets), deployed with
#      node deploy.mjs --mainnet   (passes --env mainnet to wrangler). Own domain reveal.catbattlegrounds.com because some
#      ISPs block *.workers.dev. Every key below must be repeated here: wrangler does not inherit vars / routes into an env.
[env.mainnet]
name = "cmbg-reveal-mainnet"
workers_dev = true
routes = [{ pattern = "reveal.catbattlegrounds.com", custom_domain = true }]

[env.mainnet.triggers]
crons = ["* * * * *"]

[env.mainnet.vars]
CHAIN_ID = "4663"
# tried in order (src/reveal.js pickRpc). The public RPC answers 429 to Cloudflare (2026-11-08), so Pinax (listed in
# docs.robinhood.com/chain/connecting) goes first. Better: secret RPC_PRIVATE = Alchemy URL with key (wrangler secret put RPC_PRIVATE --env mainnet).
RPC_URL = "https://robinhood.rpc.pinax.network,https://rpc.mainnet.chain.robinhood.com"
# HashChainRandomSource from Contracts/deployments/robinhoodMainnet.json (deployed 2026-11-08)
SOURCE = "0xB672391FC5bAa31eA900C3158623655a8583282c"
ALLOW_ORIGIN = "*"   # /poke only wakes the reveal; www and the apex both call it

# Secrets (set by deploy.mjs, never in this file):
#   OPERATOR_KEY       private key of the operator wallet (generated by deploy.mjs, only reveals, holds a little ETH for gas)
#   CHAIN_CHECKPOINTS  every 256th link of the secret hash chain (from the seed file), JSON
